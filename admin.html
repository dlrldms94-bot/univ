<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEP-UP 관리자 페이지</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/font.css">
    <link rel="stylesheet" href="css/admin.css">
</head>     

<body>
    <div class="admin-wrap">
        <header class="admin-header">
            <a href="index.html" class="back-link">메인으로 돌아가기</a>
            <h1>STEP-UP 지원서 관리자 페이지</h1>
            <p>관리자 인증 후 누적 지원 데이터를 엑셀로 다운로드할 수 있습니다.</p>
        </header>

        <section class="admin-card" id="loginCard">
            <h2>관리자 로그인</h2>
            <label for="adminPassword">비밀번호</label>
            <input type="password" id="adminPassword" placeholder="관리자 비밀번호를 입력하세요">
            <button type="button" id="loginBtn">확인</button>
            <p class="message" id="loginMessage"></p>
        </section>

        <section class="admin-card hidden" id="dashboardCard">
            <h2>지원 데이터 관리</h2>
            <p id="recordCount">누적 지원 건수: 0건</p>
            <div class="actions">
                <button type="button" id="refreshBtn" class="secondary-btn">새로고침</button>
                <button type="button" id="downloadBtn">엑셀 다운로드</button>
                <button type="button" id="deleteSelectedBtn" class="danger-btn">선택 삭제</button>
            </div>
            <div class="list-head">
                <label class="check-inline">
                    <input type="checkbox" id="selectAllRows">
                    전체 선택
                </label>
            </div>
            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>선택</th>
                            <th>ID</th>
                            <th>제출일시</th>
                            <th>성명</th>
                            <th>연락처</th>
                            <th>이메일</th>
                        </tr>
                    </thead>
                    <tbody id="applicationRows"></tbody>
                </table>
            </div>
            <p class="message" id="dashboardMessage"></p>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        const loginCard = document.getElementById("loginCard");
        const dashboardCard = document.getElementById("dashboardCard");
        const passwordInput = document.getElementById("adminPassword");
        const loginBtn = document.getElementById("loginBtn");
        const loginMessage = document.getElementById("loginMessage");
        const recordCount = document.getElementById("recordCount");
        const refreshBtn = document.getElementById("refreshBtn");
        const downloadBtn = document.getElementById("downloadBtn");
        const deleteSelectedBtn = document.getElementById("deleteSelectedBtn");
        const selectAllRows = document.getElementById("selectAllRows");
        const applicationRows = document.getElementById("applicationRows");
        const dashboardMessage = document.getElementById("dashboardMessage");
        const isPreviewMode = new URLSearchParams(window.location.search).get("preview") === "1";
        let adminSessionPassword = "";
        let latestApplications = [];

        async function fetchApplications() {
            const response = await fetch("/api/applications", {
                method: "GET",
                headers: {
                    "x-admin-password": adminSessionPassword
                }
            });

            if (!response.ok) {
                if (response.status === 401) {
                    throw new Error("관리자 인증에 실패했습니다.");
                }
                throw new Error("데이터를 불러오지 못했습니다.");
            }

            return response.json();
        }

        async function updateCount() {
            const data = await fetchApplications();
            latestApplications = data;
            recordCount.textContent = "누적 지원 건수: " + String(data.length) + "건";
            renderApplicationRows(data);
            return data;
        }

        function formatDate(value) {
            if (!value) {
                return "-";
            }
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) {
                return String(value);
            }
            return date.toLocaleString("ko-KR");
        }

        function renderApplicationRows(data) {
            if (!Array.isArray(data) || data.length === 0) {
                applicationRows.innerHTML = '<tr><td colspan="6" class="empty-row">지원 데이터가 없습니다.</td></tr>';
                selectAllRows.checked = false;
                return;
            }

            const rowsHtml = data.map(item => {
                const safeName = item.성명 ?? "";
                const safePhone = item.연락처 ?? "";
                const safeEmail = item.이메일 ?? "";
                return `
                    <tr>
                        <td><input type="checkbox" class="row-check" value="${item.id}"></td>
                        <td>${item.id}</td>
                        <td>${formatDate(item.serverSavedAt || item.제출일시)}</td>
                        <td>${safeName}</td>
                        <td>${safePhone}</td>
                        <td>${safeEmail}</td>
                    </tr>
                `;
            }).join("");

            applicationRows.innerHTML = rowsHtml;
            selectAllRows.checked = false;
        }

        function getSelectedIds() {
            return Array.from(document.querySelectorAll(".row-check:checked"))
                .map(input => Number(input.value))
                .filter(id => Number.isInteger(id) && id > 0);
        }

        async function deleteSelectedApplications(ids) {
            const response = await fetch("/api/applications", {
                method: "DELETE",
                headers: {
                    "Content-Type": "application/json",
                    "x-admin-password": adminSessionPassword
                },
                body: JSON.stringify({ ids })
            });

            if (!response.ok) {
                if (response.status === 401) {
                    throw new Error("관리자 인증에 실패했습니다.");
                }
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.message || "삭제에 실패했습니다.");
            }

            return response.json();
        }

        async function openDashboard() {
            loginCard.classList.add("hidden");
            dashboardCard.classList.remove("hidden");
            dashboardMessage.textContent = "";
            try {
                await updateCount();
                return true;
            } catch (error) {
                loginCard.classList.remove("hidden");
                dashboardCard.classList.add("hidden");
                dashboardMessage.textContent = error.message;
                return false;
            }
        }

        function openPreviewDashboard() {
            const previewData = [
                {
                    id: 101,
                    serverSavedAt: new Date().toISOString(),
                    성명: "홍길동",
                    연락처: "010-1111-2222",
                    이메일: "preview1@example.com"
                },
                {
                    id: 102,
                    serverSavedAt: new Date(Date.now() - 3600 * 1000).toISOString(),
                    성명: "김철수",
                    연락처: "010-3333-4444",
                    이메일: "preview2@example.com"
                }
            ];
            loginCard.classList.add("hidden");
            dashboardCard.classList.remove("hidden");
            latestApplications = previewData;
            recordCount.textContent = "누적 지원 건수: " + String(previewData.length) + "건 (미리보기)";
            renderApplicationRows(previewData);
            dashboardMessage.textContent = "미리보기 모드입니다. 실제 삭제/다운로드는 동작하지 않습니다.";
            [refreshBtn, downloadBtn, deleteSelectedBtn].forEach(button => {
                button.disabled = true;
            });
        }

        function downloadExcel(data) {
            if (!Array.isArray(data) || data.length === 0) {
                dashboardMessage.textContent = "다운로드할 데이터가 없습니다.";
                return;
            }
            const orderedFields = [
                "제출일시",
                "개인정보동의",
                "장애인등록여부",
                "대학재학졸업여부",
                "성명",
                "주민등록번호",
                "거주지주소",
                "연락처",
                "이메일",
                "성별",
                "장애유형",
                "장애정도",
                "보조기기",
                "학교명",
                "학과",
                "재학상태",
                "지원유형",
                "인턴형참가여부",
                "체험형1순위",
                "체험형2순위",
                "체험형3순위",
                "인턴형1순위",
                "인턴형2순위",
                "희망탐방지관련",
                "서술1",
                "서술2",
                "서술3"
            ];

            const orderedData = data.map(item => {
                const nextItem = {};
                orderedFields.forEach(field => {
                    nextItem[field] = item[field] ?? "";
                });
                return nextItem;
            });

            const worksheet = XLSX.utils.json_to_sheet(orderedData, {
                header: orderedFields
            });
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "지원자목록");
            const fileName = "stepup_지원자데이터_" + new Date().toISOString().slice(0, 10) + ".xlsx";
            XLSX.writeFile(workbook, fileName);
            dashboardMessage.textContent = "엑셀 파일 다운로드가 완료되었습니다.";
        }

        loginBtn.addEventListener("click", async function () {
            const input = passwordInput.value.trim();
            if (!input) {
                loginMessage.textContent = "비밀번호를 입력해주세요.";
                return;
            }
            adminSessionPassword = input;
            const ok = await openDashboard();
            if (ok) {
                loginMessage.textContent = "";
            } else {
                adminSessionPassword = "";
                loginMessage.textContent = "비밀번호가 일치하지 않습니다.";
            }
        });

        passwordInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                loginBtn.click();
            }
        });

        refreshBtn.addEventListener("click", async function () {
            try {
                await updateCount();
                dashboardMessage.textContent = "데이터를 다시 불러왔습니다.";
            } catch (error) {
                dashboardMessage.textContent = error.message;
            }
        });

        downloadBtn.addEventListener("click", async function () {
            try {
                const data = await updateCount();
                downloadExcel(data);
            } catch (error) {
                dashboardMessage.textContent = error.message;
            }
        });

        selectAllRows.addEventListener("change", function () {
            const checks = document.querySelectorAll(".row-check");
            checks.forEach(check => {
                check.checked = this.checked;
            });
        });

        applicationRows.addEventListener("change", function (event) {
            if (!event.target.classList.contains("row-check")) {
                return;
            }
            const checks = Array.from(document.querySelectorAll(".row-check"));
            if (checks.length === 0) {
                selectAllRows.checked = false;
                return;
            }
            selectAllRows.checked = checks.every(check => check.checked);
        });

        deleteSelectedBtn.addEventListener("click", async function () {
            const selectedIds = getSelectedIds();
            if (selectedIds.length === 0) {
                dashboardMessage.textContent = "삭제할 지원서를 먼저 선택해주세요.";
                return;
            }

            const ok = window.confirm("선택한 지원서 " + String(selectedIds.length) + "건을 삭제할까요?");
            if (!ok) {
                return;
            }

            try {
                const result = await deleteSelectedApplications(selectedIds);
                await updateCount();
                const deletedCount = result?.deletedCount ?? selectedIds.length;
                dashboardMessage.textContent = String(deletedCount) + "건 삭제되었습니다.";
            } catch (error) {
                dashboardMessage.textContent = error.message;
            }
        });

        if (isPreviewMode) {
            openPreviewDashboard();
        }
    </script>
</body>

</html>
