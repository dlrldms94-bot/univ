services:
  - type: web
    name: univ-stepup-web
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: univ-stepup-db
          property: connectionString

databases:
  - name: univ-stepup-db
    plan: free
